<!DOCTYPE html>
<html>
<head>

<title>CREX Login</title>

<style>

body{
background-image: url("{{ url_for('static', filename='images/image2.jpg') }}");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:rgba(30,41,59,0.75);
backdrop-filter:blur(8px);
padding:30px;
border-radius:12px;
width:320px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h2{
color:#22c55e;
margin-bottom:15px;
}

input{
width:90%;
padding:10px;
margin:6px;
border:none;
border-radius:6px;
outline:none;
}

button{
width:95%;
padding:10px;
margin:6px;
border:none;
border-radius:6px;
background:#22c55e;
color:white;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:0.9;
}

.google{
background:#ea4335;
}

#msg{
margin-top:10px;
color:#f87171;
font-size:14px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="card">

<h2>🏏 CREX LOGIN</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>

<button class="google" onclick="googleLogin()">Sign in with Google</button>

<p id="msg"></p>

</div>

<script>

// ⚠️ USE ONLY ANON PUBLIC KEY HERE
const supabaseClient = supabase.createClient(
"https://kgmvprtxxvkaavqziwpx.supabase.co",
"YOUR_ANON_PUBLIC_KEY"
);


// 🔐 EMAIL LOGIN
async function login(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const { error } = await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
document.getElementById("msg").innerText=error.message;
}else{
window.location="/dashboard";
}

}


// 📝 EMAIL SIGNUP
async function signup(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const { error } = await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){
document.getElementById("msg").innerText=error.message;
}else{
document.getElementById("msg").innerText="Signup successful!";
}

}


// 🌐 GOOGLE LOGIN
async function googleLogin(){

await supabaseClient.auth.signInWithOAuth({
provider:"google",
options:{
redirectTo: window.location.origin + "/dashboard"
}
});

}

</script>

</body>
</html>
